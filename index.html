<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brutal Barbershop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 35px 20px 40px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999999;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 15px 20px;
      border-radius: 12px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
    }

    .button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 35px;
      color: #666666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">BRUTAL</div>

    <div class="subtitle">
      BARBERSHOP
    </div>

    <div class="buttons">

      <a
        class="button"
        href="https://www.instagram.com/brutal_barbershop.13/"
        target="_blank">
        Instagram
      </a>

      <a
        class="button"
        href="https://www.brutal-barbershop.com/ru/#home"
        target="_blank">
        Официальный сайт
      </a>

      <a
        class="button"
        href="https://yandex.uz/maps/-/CXQvjRPi"
        target="_blank">
        Оставить отзыв в Яндекс
      </a>

      <a
        class="button"
        href="https://maps.app.goo.gl/QkN7aNbbb2h27q2t8"
        target="_blank">
        Оставить отзыв в Google
      </a>

      <a
        class="button"
        href="tel:+998331000101">
        Позвонить
      </a>

    </div>

    <div class="footer">
      Brutal Barbershop · Tashkent
    </div>

  </main>

</body>
</html>
